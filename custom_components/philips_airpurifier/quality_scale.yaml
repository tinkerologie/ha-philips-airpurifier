rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      filter_reset and set_child_lock are registered in async_setup and stay
      registered when entries unload; targets on unloaded entries raise
      ServiceValidationError.
  appropriate-polling:
    status: done
    comment: Uses local push via CoAP, no polling.
  brands:
    status: done
    comment: Brand images ship in custom_components/philips_airpurifier/brand.
  common-modules:
    status: done
    comment: Base entity in entity.py, coordinator in coordinator.py.
  config-flow-test-coverage:
    status: done
  config-flow:
    status: done
  dependency-transparency:
    status: done
    comment: Uses philips-airctrl from PyPI.
  docs-actions:
    status: todo
    comment: README does not document the filter_reset and set_child_lock actions yet.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: todo
  entity-event-setup:
    status: done
    comment: Entities subscribe through CoordinatorEntity only.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
  test-before-setup:
    status: done
  unique-config-entry:
    status: done
  docs-triggers:
    status: exempt
    comment: The integration provides no device triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no device conditions.

  # Silver
  action-exceptions:
    status: done
    comment: >-
      Failed device writes raise a translated HomeAssistantError; invalid
      action input raises ServiceValidationError.
  config-entry-unloading:
    status: done
    comment: >-
      Base coordinator entry cleanup owns shutdown; repeated/concurrent cleanup,
      bounded cancellation and late reconnect protection are covered by tests.
  docs-configuration-parameters:
    status: todo
    comment: The watchdog options are not documented in the README yet.
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
  reauthentication-flow:
    status: exempt
    comment: No authentication required for CoAP protocol.
  test-coverage:
    status: done
    comment: 100% line coverage, enforced by the test configuration.

  # Gold
  devices:
    status: done
  diagnostics:
    status: done
  discovery-update-info:
    status: done
    comment: >-
      DHCP discoveries are matched against existing entries by MAC (or host)
      before any network I/O; the stored host is updated and the entry
      reloaded when the device IP changes.
  discovery:
    status: done
    comment: DHCP discovery via MAC address prefixes and registered devices.
  docs-data-update:
    status: done
  docs-examples:
    status: todo
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: exempt
    comment: Single device per config entry.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: RSSI, runtime and speed diagnostics are disabled for new registrations; existing choices remain unchanged.
  entity-translations:
    status: done
  exception-translations:
    status: done
  icon-translations:
    status: done
    comment: All custom static and numeric range icons are provided by icons.json.
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
  stale-devices:
    status: exempt
    comment: Single device per config entry; removing the entry removes the device.

  # Platinum
  async-dependency:
    status: done
    comment: >-
      Inspected philips-airctrl 1.3.0 creation, read, write, observation and close
      paths: network I/O is asynchronous. Transport imports are preloaded in an
      executor. The unused synchronous discovery helper is not called.
  inject-websession:
    status: exempt
    comment: The device speaks CoAP over UDP; there is no HTTP session to inject.
  strict-typing:
    status: todo
    comment: >-
      Integration Pyright strict checks pass with Unknown/Optional diagnostics
      enforced as errors and narrow HA descriptor compatibility suppressions.
      philips-airctrl 1.3.0 ships py.typed, but verifytypes reports only 86.3%
      public type completeness; upstream typing work remains. Core's
      .strict-typing registration is not applicable to this custom integration.
