[project]
name = "ha-philips-airpurifier"
version = "0.28.0"
description = "Home Assistant integration for Philips Air Purifiers via CoAP"
requires-python = ">=3.14.2"
license = {text = "Apache-2.0"}
dependencies = [
    "philips-airctrl==1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "infrared-protocols",  # Imported by the current hassfest device-class validator.
    # Linting/formatting and type checking. Required by scripts/lint,
    # scripts/lint-check, scripts/type-check and the lint CI workflow, which all
    # invoke `uv run ruff` / `uv run pyright`. ruff is pinned to the
    # pre-commit-config version to avoid format drift between the two.
    "ruff==0.17.2",
    "pyright",
    # Linting tools for script/yaml-check, script/spell-check and related
    # scripts from the script/ toolchain.
    "yamllint",
    "codespell",
    # The homeassistant floor keeps the resolver pinned to the latest stable
    # Home Assistant. Without a floor, `uv lock --upgrade` can resolve backwards
    # to ancient releases. pytest-homeassistant-custom-component is left
    # unpinned so the resolver selects the release whose pinned HA matches the
    # floor (the newest phacc targets pre-release HA). Dependabot (homeassistant
    # group) bumps the floor on every stable HA release.
    "homeassistant>=2026.9.0",
    "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".git", "config"]
# Deprecation warnings attributed to the integration's own modules are errors.
# The module field is a regex matched from the start of the warning's module, so
# it covers every submodule; third-party deprecations keep the default action.
filterwarnings = [
    'error::DeprecationWarning:custom_components\.philips_airpurifier(\.|$)',
    'error::PendingDeprecationWarning:custom_components\.philips_airpurifier(\.|$)',
]
markers = [
    "unit: Fast, isolated tests with no external dependencies",
    "integration: Tests exercising the coordinator, time service, etc.",
]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
strict = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "S",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "tests"]
forced-separate = ["tests"]
combine-as-imports = true

[tool.coverage.run]
source = ["custom_components/philips_airpurifier"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.uv]
# Lock only for the Python that Home Assistant runs on. philips-airctrl 1.4.0
# adds a Python 3.15 marker, and without this uv also resolves an unused 3.15
# fork, backtracking Home Assistant's pins to very old releases there.
environments = ["python_full_version < '3.15'"]
# Security overrides: force patched versions of vulnerable transitive dependencies
# pinned by Home Assistant at vulnerable versions.
override-dependencies = [
    "pyjwt>=2.12.0",   # CVE-2026-32597
    "uv>=0.11.6",      # GHSA-pjjw-68hj-v9mw
]
